// Focused boiler batch duration and multi-release bytecode checks, excluded from release artifacts.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    def bytecodeTools = root.configurations.create('boilerSpeedBytecodeTools')
    root.dependencies.add(bytecodeTools.name, 'org.ow2.asm:asm:9.8')
    root.dependencies.add(bytecodeTools.name, 'org.ow2.asm:asm-tree:9.8')
    root.spotless {
        java {
            target 'src/main/java/com/xyp/gtnotgood/mixins/late/cutcorners/ThermalBoilerSpeedMixin.java',
                'scripts/qa/ThermalBoilerSpeedTest.java'
        }
    }
    root.tasks.named('compileTestJava').configure {
        setSource(root.files(root.file('scripts/qa/ThermalBoilerSpeedTest.java')))
        classpath = bytecodeTools + classpath
    }
    root.tasks.named('test').configure {
        classpath = bytecodeTools + classpath
        filter { includeTestsMatching '*ThermalBoilerSpeedTest' }
    }
}
