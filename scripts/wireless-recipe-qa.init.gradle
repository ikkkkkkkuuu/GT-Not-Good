// Opt-in wireless recipe registration checks; the test mod is never included in release jars.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.named('compileTestJava').configure {
        setSource(root.fileTree('src/test/java/com/xyp/gtnotgood/common/wireless') { include 'Wireless*ClientChecks.java' })
    }
    def runtimeJar = root.tasks.register('jarWirelessRecipeQA', Jar) {
        dependsOn root.tasks.named('classes')
        from root.sourceSets.main.output
        archiveFileName = 'wireless-recipe-qa-main.jar'
        destinationDirectory = root.layout.buildDirectory.dir('wireless-recipe-qa-runtime')
    }
    def copyTest = root.tasks.register('snapshotWirelessRecipeTest', Sync) {
        dependsOn root.tasks.named('testClasses')
        from root.sourceSets.test.output
        include '**/Wireless*ClientChecks*.class'
        into root.layout.buildDirectory.dir('wireless-recipe-qa-runtime/test')
    }
    def result = root.file('run/client/wireless-recipe-qa-result.txt')
    root.tasks.named('runClient').configure {
        dependsOn runtimeJar, copyTest
        classpath -= root.sourceSets.main.output
        classpath -= root.files(root.tasks.named('jar').flatMap { it.archiveFile })
        classpath += root.files(runtimeJar.flatMap { it.archiveFile }, root.layout.buildDirectory.dir('wireless-recipe-qa-runtime/test'))
        systemProperty 'gtng.wireless.recipe.qa', 'true'
        args '--width', '1100', '--height', '800'
        notCompatibleWithConfigurationCache('Opt-in real-client QA')
        doFirst { java.nio.file.Files.deleteIfExists(result.toPath()) }
        doLast {
            if (!result.exists() || !result.text.trim().startsWith('PASS:')) {
                throw new GradleException('Wireless recipe checks failed; inspect WIRELESS_RECIPE_QA in the client log.')
            }
        }
    }
}

