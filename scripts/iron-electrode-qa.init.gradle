// Opt-in native KubaTech checks; QA classes never enter release artifacts.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    def efr = root.file('build/factory-qa-dependencies/etfuturum-2.6.59-GTNH-dev.jar')
    if (!efr.exists()) {
        efr.parentFile.mkdirs()
        def connection = new URI('https://github.com/GTNewHorizons/Et-Futurum-Requiem/releases/download/2.6.59-GTNH/etfuturum-2.6.59-GTNH-dev.jar').toURL().openConnection()
        connection.connectTimeout = 30000
        connection.readTimeout = 30000
        def pending = new File(efr.parentFile, efr.name + '.pending')
        connection.inputStream.withCloseable { input -> pending.withOutputStream { it << input } }
        java.nio.file.Files.move(pending.toPath(), efr.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
    root.dependencies.add('runtimeOnlyNonPublishable', root.files(efr))
    root.dependencies.add('runtimeOnlyNonPublishable',
        root.extensions.getByName('elytraModpackVersion').gtnhdev('Galaxy-Space-GTNH') as String)
    root.tasks.named('compileTestJava').configure {
        setSource(root.files('scripts/qa/IronElectrodeClientChecks.java'))
    }
    def qaClasses = root.tasks.register('isolateIronElectrodeQA', Sync) {
        dependsOn root.tasks.named('testClasses')
        from root.sourceSets.test.output
        include '**/IronElectrodeClientChecks*.class'
        into root.layout.buildDirectory.dir('iron-electrode-qa/classes')
    }
    root.spotless {
        java {
            target 'src/main/java/com/xyp/gtnotgood/common/items/electrode/*.java',
                'src/main/java/com/xyp/gtnotgood/mixins/late/gregtech/arcfurnace/*.java',
                'src/main/java/com/xyp/gtnotgood/loader/ItemsLoader.java',
                'src/main/java/com/xyp/gtnotgood/loader/LateMixinsLoader.java',
                'src/main/java/com/xyp/gtnotgood/utils/enums/GTNGItemList.java',
                'src/main/java/com/xyp/gtnotgood/utils/enums/ModList.java',
                'scripts/qa/IronElectrodeClientChecks.java'
        }
    }
    root.tasks.named('runClient').configure {
        dependsOn qaClasses
        classpath += root.files(root.layout.buildDirectory.dir('iron-electrode-qa/classes'))
        if (root.hasProperty('ironElectrodeNoAngelica')) classpath = classpath.filter { !it.name.toLowerCase().contains('angelica') }
        workingDir root.file('run/iron-electrode-check')
        systemProperty 'gtng.factory.qa', 'true'
        systemProperty 'gtng.ironElectrode.qa', 'true'
        systemProperty 'gtng.ironElectrode.qa.output', root.file('build/iron-electrode-qa').absolutePath
        systemProperty 'sun.net.client.defaultConnectTimeout', '15000'
        systemProperty 'sun.net.client.defaultReadTimeout', '15000'
        args '--width', '1100', '--height', '740'
        notCompatibleWithConfigurationCache('Opt-in iron electrode client checks')
        doFirst {
            workingDir.mkdirs()
            root.file('build/iron-electrode-qa').mkdirs()
            new File(workingDir, 'options.txt').setText('lang:zh_CN\nguiScale:2\npauseOnLostFocus:false\nsoundCategory_master:0.0\n', 'UTF-8')
            java.nio.file.Files.deleteIfExists(root.file('build/iron-electrode-qa/result.txt').toPath())
            if (System.getProperty('os.name').startsWith('Windows')) {
                new ProcessBuilder('powershell.exe', '-NoProfile', '-NonInteractive', '-WindowStyle', 'Hidden',
                    '-ExecutionPolicy', 'Bypass', '-File', root.file('scripts/qa/HideFactoryClient.ps1').absolutePath,
                    '-Workspace', root.projectDir.absolutePath)
                    .redirectErrorStream(true)
                    .redirectOutput(root.file('build/iron-electrode-qa/window-helper.log'))
                    .start()
            }
        }
        doLast {
            def result = root.file('build/iron-electrode-qa/result.txt')
            if (!result.exists() || result.text.trim() != 'PASS') throw new GradleException('Iron electrode client QA failed')
        }
    }
}
