// Disposable real-client validation; excluded from release artifacts.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.named('compileTestJava').configure {
        setSource(root.fileTree('scripts/qa') { include 'EssentiaClientChecks.java' })
    }
    def mainSnapshot = root.layout.buildDirectory.dir('essentia-qa-runtime/main')
    def testSnapshot = root.layout.buildDirectory.dir('essentia-qa-runtime/test')
    def copyMain = root.tasks.register('snapshotEssentiaMain', Sync) {
        dependsOn root.tasks.named('classes')
        from root.sourceSets.main.output
        into mainSnapshot
    }
    def copyTest = root.tasks.register('snapshotEssentiaTest', Sync) {
        dependsOn root.tasks.named('testClasses')
        from root.sourceSets.test.output
        include '**/EssentiaClientChecks*.class'
        into testSnapshot
    }
    def result = root.file('run/client/essentia-qa-result.txt')
    root.tasks.named('runClient').configure {
        dependsOn copyMain, copyTest
        classpath -= root.sourceSets.main.output
        classpath -= root.files(root.tasks.named('jar').flatMap { it.archiveFile })
        classpath += root.files(mainSnapshot, testSnapshot)
        classpath += root.configurations.testRuntimeClasspath.filter {
            it.name.startsWith('ThaumicEnergistics-')
        }
        systemProperty 'gtng.essentia.qa', 'true'
        args '--width', '1100', '--height', '740'
        notCompatibleWithConfigurationCache('Opt-in disposable client checks')
        doFirst { java.nio.file.Files.deleteIfExists(result.toPath()) }
        doLast {
            if (!result.exists() || result.text.trim() != 'PASS') {
                throw new GradleException('Essentia checks failed; inspect CRUCIBLE_QA in the client log.')
            }
        }
    }
}
