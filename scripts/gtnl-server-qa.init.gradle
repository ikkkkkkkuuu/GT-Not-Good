// Build a separately named, reobfuscated QA jar for the copied RC1 dedicated server.
gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.file('.gradle/gtnl-server-qa-build'))
}
gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.named('compileTestJava').configure {
        setSource(root.files('scripts/qa/GtnlCompatibilityChecks.java'))
    }
    root.tasks.named('jar').configure {
        dependsOn root.tasks.named('testClasses')
        from root.sourceSets.test.output
        archiveFileName = 'gtnotgood-gtnl-server-qa.jar'
    }
}
