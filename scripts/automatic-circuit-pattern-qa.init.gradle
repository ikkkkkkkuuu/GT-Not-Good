// Opt-in integration: gradlew -I scripts/automatic-circuit-pattern-qa.init.gradle runClient17 --no-configuration-cache
gradle.beforeProject { project ->
    if (project == gradle.rootProject) project.layout.buildDirectory.set(project.file('.gradle/automatic-circuit-pattern-qa-build'))
}

gradle.projectsEvaluated {
    def root = gradle.rootProject
    def efr = root.file('build/factory-qa-dependencies/etfuturum-2.6.59-GTNH-dev.jar')
    if (!efr.exists()) {
        efr.parentFile.mkdirs()
        def connection = new URI('https://github.com/GTNewHorizons/Et-Futurum-Requiem/releases/download/2.6.59-GTNH/etfuturum-2.6.59-GTNH-dev.jar').toURL().openConnection()
        connection.connectTimeout = 30000
        connection.readTimeout = 30000
        def pending = new File(efr.parentFile, efr.name + '.pending')
        connection.inputStream.withCloseable { input -> pending.withOutputStream { it << input } }
        java.nio.file.Files.move(pending.toPath(), efr.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
    root.dependencies.add('runtimeOnlyNonPublishable', root.files(efr))
    root.dependencies.add('runtimeOnlyNonPublishable', root.extensions.getByName('elytraModpackVersion').gtnhdev('Railcraft') as String)
    def qaClasses = root.layout.buildDirectory.dir('automatic-circuit-pattern-qa/test-classes')
    root.tasks.named('compileTestJava').configure {
        destinationDirectory.set(qaClasses)
        setSource(root.files('scripts/qa/AutomaticCircuitPatternChecks.java'))
    }
    def runtimeClasses = root.layout.buildDirectory.dir('automatic-circuit-pattern-qa/runtime')
    def snapshot = root.tasks.register('snapshotAutomaticCircuitPatternQA', Sync) {
        dependsOn root.tasks.named('testClasses')
        from qaClasses
        into runtimeClasses
    }
    root.extensions.findByName('spotless')?.java {
        target 'src/main/java/com/xyp/gtnotgood/common/compat/AutomaticMachineCircuit.java',
            'src/main/java/com/xyp/gtnotgood/config/Config.java',
            'src/main/java/com/xyp/gtnotgood/mixins/late/appliedenergistics/AutomaticCircuitInterfaceMixin.java',
            'src/main/java/com/xyp/gtnotgood/mixins/late/appliedenergistics/AutomaticCircuitInterfaceTileMixin.java',
            'src/main/java/com/xyp/gtnotgood/loader/LateMixinsLoader.java',
            'scripts/qa/AutomaticCircuitPatternChecks.java'
    }
    root.tasks.named('runClient17').configure {
        javaLauncher.set(root.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) })
        dependsOn snapshot
        classpath += root.files(runtimeClasses)
        classpath += root.configurations.testRuntimeClasspath.filter { it.name.startsWith('jvmdowngrader-java-api-') }
        workingDir root.file('run/automatic-circuit-pattern-qa')
        systemProperty 'gtng.factory.qa', 'true'
        systemProperty 'gtng.automatic.circuit.qa', 'true'
        systemProperty 'sun.net.client.defaultConnectTimeout', '15000'
        systemProperty 'sun.net.client.defaultReadTimeout', '15000'
        notCompatibleWithConfigurationCache('Opt-in automatic circuit pattern QA')
        doFirst {
            workingDir.mkdirs()
            root.file('build/automatic-circuit-pattern-qa').mkdirs()
            java.nio.file.Files.deleteIfExists(new File(workingDir, 'result.txt').toPath())
            new File(workingDir, 'options.txt').setText(
                'lang:en_US\npauseOnLostFocus:false\nsoundCategory_master:0.0\nsoundCategory_music:0.0\n', 'UTF-8')
            if (System.getProperty('os.name').startsWith('Windows')) {
                new ProcessBuilder('powershell.exe', '-NoProfile', '-NonInteractive', '-WindowStyle', 'Hidden',
                    '-ExecutionPolicy', 'Bypass', '-File', root.file('scripts/qa/HideFactoryClient.ps1').absolutePath,
                    '-Workspace', root.projectDir.absolutePath)
                    .redirectErrorStream(true)
                    .redirectOutput(root.file('build/automatic-circuit-pattern-qa/window-helper.log')).start()
            }
        }
        doLast {
            def result = new File(workingDir, 'result.txt')
            if (!result.exists() || result.text.trim() != 'PASS') {
                throw new GradleException('Automatic circuit pattern QA failed; inspect AUTOMATIC_CIRCUIT_PATTERN_QA in the client log.')
            }
        }
    }
}
