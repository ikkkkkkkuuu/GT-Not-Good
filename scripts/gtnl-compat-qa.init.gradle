// Full published GTNL client integration on the pack-pinned development dependencies and Java 21.
gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.file('.gradle/gtnl-compat-qa-build'))
}
gradle.projectsEvaluated {
    def root = gradle.rootProject
    // Pack-pinned development jar; opt-in QA only, never embedded in the addon.
    def efr = root.file('build/factory-qa-dependencies/etfuturum-2.6.59-GTNH-dev.jar')
    if (!efr.exists()) {
        efr.parentFile.mkdirs()
        def connection = new URI('https://github.com/GTNewHorizons/Et-Futurum-Requiem/releases/download/2.6.59-GTNH/etfuturum-2.6.59-GTNH-dev.jar').toURL().openConnection()
        connection.connectTimeout = 30000
        connection.readTimeout = 30000
        def pending = new File(efr.parentFile, efr.name + '.pending')
        connection.inputStream.withCloseable { input -> pending.withOutputStream { it << input } }
        java.nio.file.Files.move(pending.toPath(), efr.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
    root.dependencies.add('runtimeOnlyNonPublishable', root.files(efr))
    def gtnl = root.file('build/gtnl-compat-dependencies/sciencenotleisure-0.2.7-rc1-dev.jar')
    if (!gtnl.exists()) {
        gtnl.parentFile.mkdirs()
        def connection = new URI('https://github.com/ABKQPO/GT-Not-Leisure/releases/download/0.2.7-rc1/' + gtnl.name).toURL().openConnection()
        connection.connectTimeout = 30000
        connection.readTimeout = 60000
        connection.inputStream.withCloseable { input -> gtnl.withOutputStream { it << input } }
    }
    def digest = java.security.MessageDigest.getInstance('SHA-256').digest(gtnl.bytes).encodeHex().toString()
    if (digest != 'c36ff329db26dd5df3d70e825bb2741c12fe1818c9d67d4a7b4323cd6ed6e8cc') {
        throw new GradleException('GTNL RC1 development jar checksum mismatch: ' + gtnl)
    }
    root.dependencies.add('runtimeOnlyNonPublishable', root.files(gtnl))
    root.dependencies.add('runtimeOnlyNonPublishable', 'com.github.ABKQPO:BetterQuestingAPI:1.1.3:dev') { transitive = false }
    def pack = root.extensions.getByName('elytraModpackVersion')
    ['Galacticraft', 'Galaxy-Space-GTNH', 'EnderIO', 'ThaumicHorizons', 'ThaumicEnergistics',
        'Avaritiaddons', 'BloodArsenal', 'ThaumicBases', 'Railcraft', 'AspectRecipeIndex'].each {
        root.dependencies.add('runtimeOnlyNonPublishable', pack.gtnhdev(it) as String)
    }
    root.tasks.named('compileTestJava').configure {
        setSource(root.files(root.file('scripts/qa/QuickTerminalScrollClientChecks.java'),
            root.file('scripts/qa/InvTweaksOrderCacheClientChecks.java'),
            root.file('scripts/qa/ItemSortNameCacheClientChecks.java'),
            root.file('scripts/qa/InterfaceViewportClientChecks.java'),
            root.file('scripts/qa/InterfaceNameClientChecks.java'),
            root.file('scripts/qa/GtnlCompatibilityChecks.java')))
    }
    root.spotless {
        java {
            target 'src/main/java/com/xyp/gtnotgood/ae2thing/quickterminal/RecipeTransferPayload.java',
                'src/main/java/com/xyp/gtnotgood/ae2thing/quickterminal/ContainerQuickEncodingTerminal.java',
                'src/main/java/com/xyp/gtnotgood/ae2thing/quickterminal/DualTerminalGuiObject.java',
                'src/main/java/com/xyp/gtnotgood/ae2thing/quickterminal/client/GuiQuickEncodingTerminal.java',
                'scripts/qa/QuickTerminalScrollClientChecks.java',
                'scripts/qa/InvTweaksOrderCacheClientChecks.java',
                'scripts/qa/ItemSortNameCacheClientChecks.java',
                'scripts/qa/InterfaceViewportClientChecks.java',
                'scripts/qa/InterfaceNameClientChecks.java',
                'scripts/qa/GtnlCompatibilityChecks.java',
                'src/main/java/com/xyp/gtnotgood/ClientProxy.java',
                'src/main/java/com/xyp/gtnotgood/mixins/GTNotGoodMixinConfigPlugin.java',
                'src/main/java/com/xyp/gtnotgood/utils/text/TextEffectsCompat.java',
                'src/main/java/com/xyp/gtnotgood/mixins/late/AppliedEnergistics/InterfaceEntryViewportAccessor.java',
                'src/main/java/com/xyp/gtnotgood/mixins/late/AppliedEnergistics/InterfaceTerminalViewportMixin.java',
                'src/main/java/com/xyp/gtnotgood/ae2thing/quickterminal/client/ItemSortNameCache.java',
                'src/main/java/com/xyp/gtnotgood/mixins/late/AppliedEnergistics/ItemRepoSortNameCacheMixin.java',
                'src/main/java/com/xyp/gtnotgood/mixins/late/AppliedEnergistics/ItemSortersNameCacheMixin.java',
                'src/main/java/com/xyp/gtnotgood/mixins/late/AppliedEnergistics/InvTweaksOrderCacheMixin.java',
                'src/main/java/com/xyp/gtnotgood/loader/LateMixinsLoader.java'
        }
    }
    root.tasks.named('runClient17').configure {
        javaLauncher.set(root.javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        })
        classpath += root.configurations.testRuntimeClasspath.filter { it.name.startsWith('jvmdowngrader-java-api-') }
        dependsOn root.tasks.named('testClasses')
        classpath += root.sourceSets.test.output
        workingDir root.file('run/gtnl-compat-check')
        systemProperty 'gtng.factory.qa', 'true'
        systemProperty 'gtng.terminalScroll.qa', 'true'
        systemProperty 'gtng.gtnlCompat.qa', 'true'
        systemProperty 'gtng.gtnlCompat.report', root.file('build/gtnl-compat-qa/integration.txt').absolutePath
        // Optional third-party sound downloads must not stall the isolated recipe checks indefinitely.
        systemProperty 'sun.net.client.defaultConnectTimeout', '15000'
        systemProperty 'sun.net.client.defaultReadTimeout', '15000'
        systemProperty 'gtng.terminalScroll.qa.output', root.file('build/gtnl-compat-qa').absolutePath
        args '--width', '1100', '--height', '740'
        notCompatibleWithConfigurationCache('Opt-in terminal client checks')
        doFirst {
            root.file('build/gtnl-compat-qa').mkdirs()

            workingDir.mkdirs()
            new File(workingDir, 'options.txt').setText('lang:zh_CN\nguiScale:2\npauseOnLostFocus:false\n', 'UTF-8')
            java.nio.file.Files.deleteIfExists(root.file('build/gtnl-compat-qa/result.txt').toPath())
            if (System.getProperty('os.name').startsWith('Windows')) {
                new ProcessBuilder('powershell.exe', '-NoProfile', '-NonInteractive', '-WindowStyle', 'Hidden',
                    '-ExecutionPolicy', 'Bypass', '-File', root.file('scripts/qa/HideFactoryClient.ps1').absolutePath,
                    '-Workspace', root.projectDir.absolutePath)
                    .redirectErrorStream(true)
                    .redirectOutput(root.file('build/gtnl-compat-qa/window-helper.log'))
                    .start()
            }
        }
        doLast {
            def result = root.file('build/gtnl-compat-qa/result.txt')
            if (!result.exists() || result.text.trim() != 'PASS') throw new GradleException('Terminal client QA failed')
        }
    }
}
