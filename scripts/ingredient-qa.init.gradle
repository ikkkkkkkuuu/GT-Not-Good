// Runs quick-terminal ingredient checks in a new disposable world; no existing save is opened.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.named('runClient').configure {
        dependsOn root.tasks.named('testClasses')
        classpath += root.sourceSets.test.output
        systemProperty 'gtng.ingredient.qa', 'true'
    }
}
