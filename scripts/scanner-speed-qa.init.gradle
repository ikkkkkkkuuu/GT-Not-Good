// Focused scanner runtime duration checks; QA dependencies stay out of release artifacts.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    def bytecodeTools = root.configurations.create('scannerSpeedBytecodeTools')
    root.dependencies.add(bytecodeTools.name, 'org.ow2.asm:asm:9.8')
    root.dependencies.add(bytecodeTools.name, 'org.ow2.asm:asm-tree:9.8')
    root.spotless {
        java {
            target 'src/main/java/com/xyp/gtnotgood/mixins/late/CutCorners/ScannerSpeedMixin.java',
                'scripts/qa/ScannerSpeedTargetTest.java'
        }
    }
    root.tasks.named('compileTestJava').configure {
        setSource(root.files(root.file('scripts/qa/ScannerSpeedTargetTest.java')))
        classpath = bytecodeTools + classpath
    }
    root.tasks.named('test').configure {
        classpath = bytecodeTools + classpath
        filter { includeTestsMatching '*ScannerSpeedTargetTest' }
    }
}
