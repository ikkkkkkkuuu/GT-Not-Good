// Disposable, real-client AE network checks. Fixtures never enter release jars.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.named('compileTestJava').configure {
        setSource(root.fileTree('src/test/java/com/xyp/gtnotgood/common/advancedio') { include 'AdvancedIOClientChecks.java' })
    }
    def runtimeJar = root.tasks.register('jarAdvancedIOQA', Jar) {
        dependsOn root.tasks.named('classes')
        from root.sourceSets.main.output
        archiveFileName = 'advancedio-qa-main.jar'
        destinationDirectory = root.layout.buildDirectory.dir('advancedio-qa-runtime')
    }
    def copyTest = root.tasks.register('snapshotAdvancedIOTest', Sync) {
        dependsOn root.tasks.named('testClasses')
        from root.sourceSets.test.output
        include '**/AdvancedIOClientChecks*.class'
        into root.layout.buildDirectory.dir('advancedio-qa-runtime/test')
    }
    def resume = root.findProperty('advancedIOResume') ?: ''
    def result = root.file('run/client/advancedio-qa-result.txt')
    root.tasks.named('runClient').configure {
        dependsOn runtimeJar, copyTest
        classpath -= root.sourceSets.main.output
        classpath -= root.files(root.tasks.named('jar').flatMap { it.archiveFile })
        classpath += root.files(runtimeJar.flatMap { it.archiveFile }, root.layout.buildDirectory.dir('advancedio-qa-runtime/test'))
        systemProperty 'gtng.advancedio.qa', 'true'
        systemProperty 'gtng.advancedio.resume', resume
        args '--width', '1100', '--height', '800'
        notCompatibleWithConfigurationCache('Opt-in real-client QA')
        doFirst { java.nio.file.Files.deleteIfExists(result.toPath()) }
        doLast {
            if (!result.exists() || result.text.trim() != (resume ? 'PASS' : 'SAVED')) {
                throw new GradleException('Advanced IO checks failed; inspect ADVANCED_IO_QA in the client log.')
            }
        }
    }
}
