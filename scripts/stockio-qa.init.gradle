// Real native GT / AE transaction and GUI checks in a disposable hidden client.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    def efr = root.file('build/factory-qa-dependencies/etfuturum-2.6.59-GTNH-dev.jar')
    if (!efr.exists()) throw new GradleException('Prepare the existing factory QA Et Futurum runtime first')
    root.dependencies.add('runtimeOnlyNonPublishable', root.files(efr))
    def qaClasses = root.layout.buildDirectory.dir('stockio-qa/test-classes')
    root.tasks.named('compileTestJava').configure {
        destinationDirectory.set(qaClasses)
        setSource(root.files('scripts/qa/StockIOClientChecks.java', 'scripts/qa/StockIOGuiClientChecks.java',
            'src/test/java/com/xyp/gtnotgood/common/blocks/stockio/StockIOLogicTest.java'))
    }
    def runtimeJar = root.tasks.register('jarStockIOQA', Jar) {
        dependsOn root.tasks.named('classes')
        from root.sourceSets.main.output
        archiveFileName = 'stockio-qa-main.jar'
        destinationDirectory = root.layout.buildDirectory.dir('stockio-qa')
    }
    root.tasks.named('runClient').configure {
        dependsOn runtimeJar, root.tasks.named('testClasses')
        classpath -= root.sourceSets.main.output
        classpath -= root.files(root.tasks.named('jar').flatMap { it.archiveFile })
        classpath += root.files(runtimeJar.flatMap { it.archiveFile }, qaClasses)
        classpath += root.sourceSets.test.runtimeClasspath.filter {
            it.name.startsWith('junit-') || it.name.startsWith('hamcrest-')
        }
        workingDir root.file('run/stockio-qa')
        systemProperty 'gtng.factory.qa', 'true'
        systemProperty 'gtng.stockio.qa', 'true'
        systemProperty 'gtng.stockio.qa.output', root.file('build/stockio-qa').absolutePath
        systemProperty 'sun.net.client.defaultConnectTimeout', '15000'
        systemProperty 'sun.net.client.defaultReadTimeout', '15000'
        args '--width', '1100', '--height', '800'
        notCompatibleWithConfigurationCache('Opt-in real native GT client QA')
        doFirst {
            root.file('build/stockio-qa').mkdirs()
            workingDir.mkdirs()
            new File(workingDir, 'options.txt').setText('lang:zh_CN\nguiScale:2\npauseOnLostFocus:false\n', 'UTF-8')
            java.nio.file.Files.deleteIfExists(root.file('build/stockio-qa/result.txt').toPath())
            if (System.getProperty('os.name').startsWith('Windows')) {
                new ProcessBuilder('powershell.exe', '-NoProfile', '-NonInteractive', '-WindowStyle', 'Hidden',
                    '-ExecutionPolicy', 'Bypass', '-File', root.file('scripts/qa/HideFactoryClient.ps1').absolutePath,
                    '-Workspace', root.projectDir.absolutePath)
                    .redirectErrorStream(true).redirectOutput(root.file('build/stockio-qa/window-helper.log')).start()
            }
        }
        doLast {
            def result = root.file('build/stockio-qa/result.txt')
            if (!result.exists() || result.text.trim() != 'PASS') {
                throw new GradleException('Stock IO client QA failed; inspect STOCK_IO_QA in the client log')
            }
        }
    }
}
