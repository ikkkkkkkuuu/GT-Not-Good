// gradlew.bat -I scripts/comb-processing-qa.init.gradle runClient17 --no-configuration-cache
gradle.beforeProject { project ->
    if (project == gradle.rootProject) project.layout.buildDirectory.set(project.file('.gradle/comb-processing-qa-build'))
}

gradle.projectsEvaluated {
    def root = gradle.rootProject
    def efr = root.file('build/factory-qa-dependencies/etfuturum-2.6.59-GTNH-dev.jar')
    if (!efr.isFile()) throw new GradleException('Missing factory QA dependency: ' + efr)
    root.dependencies.add('runtimeOnlyNonPublishable', root.files(efr))
    def pack = root.extensions.getByName('elytraModpackVersion')
    ['Railcraft', 'NewHorizonsCoreMod'].each {
        root.dependencies.add('runtimeOnlyNonPublishable', pack.gtnhdev(it) as String)
    }
    root.tasks.named('compileTestJava').configure {
        setSource(root.files('scripts/qa/CombProcessingClientChecks.java'))
    }
    root.spotless.java {
        target 'scripts/qa/CombProcessingClientChecks.java'
    }
    def mainSnapshot = root.layout.buildDirectory.dir('comb-processing-qa-runtime/main')
    def testSnapshot = root.layout.buildDirectory.dir('comb-processing-qa-runtime/test')
    def copyMain = root.tasks.register('snapshotCombProcessingMain', Sync) {
        dependsOn root.tasks.named('classes')
        from root.sourceSets.main.output
        into mainSnapshot
    }
    def copyTest = root.tasks.register('snapshotCombProcessingTest', Sync) {
        dependsOn root.tasks.named('testClasses')
        from root.sourceSets.test.output
        include '**/CombProcessingClientChecks*.class'
        into testSnapshot
    }
    def output = root.file('build/comb-processing-qa')
    def result = new File(output, 'result.txt')
    root.tasks.named('runClient17').configure {
        javaLauncher.set(root.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) })
        dependsOn copyMain, copyTest
        classpath -= root.sourceSets.main.output
        classpath -= root.files(root.tasks.named('jar').flatMap { it.archiveFile })
        classpath += root.files(mainSnapshot, testSnapshot)
        classpath += root.configurations.testRuntimeClasspath.filter {
            it.name.startsWith('jvmdowngrader-java-api-')
        }
        workingDir new File(output, 'client')
        systemProperty 'gtng.factory.qa', 'true'
        systemProperty 'gtng.combProcessing.qa', 'true'
        systemProperty 'gtng.combProcessing.qa.output', output.absolutePath
        systemProperty 'sun.net.client.defaultConnectTimeout', '15000'
        systemProperty 'sun.net.client.defaultReadTimeout', '15000'
        args '--width', '1280', '--height', '900'
        notCompatibleWithConfigurationCache('Opt-in comb processing client checks')
        doFirst {
            workingDir.mkdirs()
            output.mkdirs()
            java.nio.file.Files.deleteIfExists(result.toPath())
            def configDirectory = new File(workingDir, 'config/GTNOTGOOD')
            configDirectory.mkdirs()
            new File(configDirectory, 'gtnotgood.cfg').setText('cutcorners {\n    I:mode=0\n}\n', 'UTF-8')
            def coreConfig = new File(workingDir, 'config/DreamCoreMod.properties')
            def coreProperties = new Properties()
            if (coreConfig.exists()) coreConfig.withInputStream { coreProperties.load(it) }
            coreProperties.setProperty('showConfirmExitWindow', 'false')
            coreConfig.withOutputStream { coreProperties.store(it, null) }
            new File(workingDir, 'options.txt').setText(
                'lang:zh_CN\nguiScale:1\npauseOnLostFocus:false\nrenderDistance:4\nsoundCategory_master:0.0\nsoundCategory_music:0.0\n',
                'UTF-8')
            if (System.getProperty('os.name').startsWith('Windows')) {
                new ProcessBuilder('powershell.exe', '-NoProfile', '-NonInteractive', '-WindowStyle', 'Hidden',
                    '-ExecutionPolicy', 'Bypass', '-File', root.file('scripts/qa/HideFactoryClient.ps1').absolutePath,
                    '-Workspace', workingDir.absolutePath)
                    .redirectErrorStream(true).redirectOutput(new File(output, 'window-helper.log')).start()
            }
        }
        doLast {
            if (!result.exists() || !result.text.startsWith('PASS')) {
                throw new GradleException('Comb processing QA failed; inspect COMB_PROCESSING_QA in ' +
                    workingDir + '/logs/fml-client-latest.log.')
            }
        }
    }
}
