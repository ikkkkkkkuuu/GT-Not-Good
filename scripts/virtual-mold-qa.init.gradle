// Opt-in integration run: gradlew -I scripts/virtual-mold-qa.init.gradle runClient --no-configuration-cache
// The QA mod creates a disposable world and exits after checks and GUI screenshots; it is never packaged.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    def efr = root.file('build/factory-qa-dependencies/etfuturum-2.6.59-GTNH-dev.jar')
    if (!efr.exists()) {
        efr.parentFile.mkdirs()
        def connection = new URI('https://github.com/GTNewHorizons/Et-Futurum-Requiem/releases/download/2.6.59-GTNH/etfuturum-2.6.59-GTNH-dev.jar').toURL().openConnection()
        connection.connectTimeout = 30000
        connection.readTimeout = 30000
        def pending = new File(efr.parentFile, efr.name + '.pending')
        connection.inputStream.withCloseable { input -> pending.withOutputStream { it << input } }
        java.nio.file.Files.move(pending.toPath(), efr.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
    root.dependencies.add('runtimeOnlyNonPublishable', root.files(efr))
    def qaClasses = root.layout.buildDirectory.dir('virtual-mold-qa/test-classes')
    root.tasks.named('compileTestJava').configure {
        destinationDirectory.set(qaClasses)
        setSource(root.files(root.file('scripts/qa/VirtualMoldClientChecks.java')))
    }
    root.extensions.findByName('spotless')?.java {
        target 'src/main/java/com/xyp/gtnotgood/utils/machine/MoldDataManager.java',
            'src/main/java/com/xyp/gtnotgood/utils/enums/ModsItemlist.java',
            'scripts/qa/VirtualMoldClientChecks.java'
    }
    root.tasks.named('runClient').configure {
        dependsOn root.tasks.named('testClasses')
        classpath += root.files(qaClasses)
        workingDir root.file('run/virtual-mold-check')
        systemProperty 'gtng.factory.qa', 'true'
        systemProperty 'gtng.mold.qa', 'true'
        systemProperty 'gtng.mold.qa.output', root.file('build/virtual-mold-qa').absolutePath
        systemProperty 'sun.net.client.defaultConnectTimeout', '15000'
        systemProperty 'sun.net.client.defaultReadTimeout', '15000'
        args '--width', '1100', '--height', '740'
        notCompatibleWithConfigurationCache('Opt-in virtual mold client checks')
        doFirst {
            root.file('build/virtual-mold-qa').mkdirs()
            workingDir.mkdirs()
            new File(workingDir, 'options.txt').setText('lang:zh_CN\nguiScale:2\npauseOnLostFocus:false\n', 'UTF-8')
            java.nio.file.Files.deleteIfExists(root.file('build/virtual-mold-qa/result.txt').toPath())
            if (System.getProperty('os.name').startsWith('Windows')) {
                new ProcessBuilder('powershell.exe', '-NoProfile', '-NonInteractive', '-WindowStyle', 'Hidden',
                    '-ExecutionPolicy', 'Bypass', '-File', root.file('scripts/qa/HideFactoryClient.ps1').absolutePath,
                    '-Workspace', root.projectDir.absolutePath)
                    .redirectErrorStream(true)
                    .redirectOutput(root.file('build/virtual-mold-qa/window-helper.log'))
                    .start()
            }
        }
        doLast {
            def result = root.file('build/virtual-mold-qa/result.txt')
            if (!result.exists() || result.text.trim() != 'PASS') throw new GradleException('Virtual mold client QA failed')
        }
    }
}
