// Opt-in runtime checks; never includes the QA mod in the published jar.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.named('compileTestJava').configure {
        setSource(root.fileTree('src/test/java/com/xyp/gtnotgood/common/packaged') {
            include 'AssemblyLineClientChecks.java'
        })
    }
    def testSnapshot = root.tasks.register('snapshotAssemblyTest', Sync) {
        dependsOn root.tasks.named('testClasses')
        from root.sourceSets.test.output
        include '**/AssemblyLineClientChecks*.class'
        into root.layout.buildDirectory.dir('assembly-qa-runtime/test')
    }
    root.tasks.named('runClient').configure {
        dependsOn testSnapshot
        classpath += root.files(root.layout.buildDirectory.dir('assembly-qa-runtime/test'))
        systemProperty 'gtng.assembly.qa', 'true'
        args '--width', '1100', '--height', '740'
        notCompatibleWithConfigurationCache('Opt-in runtime QA closures retain the project')
        doFirst { java.nio.file.Files.deleteIfExists(root.file('run/client/assembly-qa-result.txt').toPath()) }
        doLast {
            def result = root.file('run/client/assembly-qa-result.txt')
            if (!result.exists() || result.text.trim() != 'PASS') throw new GradleException('Assembly core QA failed.')
        }
    }
}
