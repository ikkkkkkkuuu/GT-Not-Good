// Native wireless classes with third-party ratings must not crash recipe registration.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.named('compileTestJava').configure {
        setSource(root.files('scripts/qa/EasyWirelessRecipesTest.java'))
    }
    root.tasks.named('test').configure {
        include '**/EasyWirelessRecipesTest.class'
    }
}
