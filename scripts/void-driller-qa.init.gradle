// Opt-in integrated-world checks; QA classes stay outside release artifacts.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    def qaLanguage = root.findProperty('voidDrillerQaLanguage') ?: 'zh_CN'
    def qaScale = root.findProperty('voidDrillerQaScale') ?: '2'
    def efr = root.file('build/factory-qa-dependencies/etfuturum-2.6.59-GTNH-dev.jar')
    if (!efr.exists()) {
        efr.parentFile.mkdirs()
        def connection = new URI('https://github.com/GTNewHorizons/Et-Futurum-Requiem/releases/download/2.6.59-GTNH/etfuturum-2.6.59-GTNH-dev.jar').toURL().openConnection()
        connection.connectTimeout = 30000
        connection.readTimeout = 30000
        def pending = new File(efr.parentFile, efr.name + '.pending')
        connection.inputStream.withCloseable { input -> pending.withOutputStream { it << input } }
        java.nio.file.Files.move(pending.toPath(), efr.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
    root.dependencies.add('runtimeOnlyNonPublishable', root.files(efr))
    def pack = root.extensions.getByName('elytraModpackVersion')
    ['Galacticraft', 'Galaxy-Space-GTNH', 'EnderIO', 'ThaumicHorizons', 'ThaumicEnergistics',
        'Avaritiaddons', 'BloodArsenal', 'ThaumicBases', 'Railcraft', 'AspectRecipeIndex'].each {
        root.dependencies.add('runtimeOnlyNonPublishable', pack.gtnhdev(it) as String)
    }
    root.tasks.named('compileTestJava').configure {
        setSource(root.files('scripts/qa/VoidDrillerClientChecks.java'))
    }
    def qaClasses = root.tasks.register('isolateVoidDrillerQA', Sync) {
        dependsOn root.tasks.named('testClasses')
        from root.sourceSets.test.output
        include '**/VoidDrillerClientChecks*.class'
        into root.layout.buildDirectory.dir('void-driller-qa/classes')
    }
    root.spotless.java {
        target 'scripts/qa/VoidDrillerClientChecks.java'
    }
    root.tasks.named('runClient17').configure {
        javaLauncher.set(root.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) })
        dependsOn qaClasses
        classpath += root.files(root.layout.buildDirectory.dir('void-driller-qa/classes'))
        classpath += root.configurations.testRuntimeClasspath.filter { it.name.startsWith('jvmdowngrader-java-api-') }
        if (root.hasProperty('voidDrillerNoAngelica')) {
            classpath = classpath.filter { !it.name.toLowerCase().contains('angelica') }
        }
        workingDir root.file('run/void-driller-qa')
        systemProperty 'gtng.factory.qa', 'true'
        systemProperty 'gtng.voidDriller.qa', 'true'
        systemProperty 'gtng.voidDriller.output', root.file("build/void-driller-qa/${qaLanguage}-scale${qaScale}").absolutePath
        systemProperty 'sun.net.client.defaultConnectTimeout', '15000'
        systemProperty 'sun.net.client.defaultReadTimeout', '15000'
        args '--width', '1100', '--height', '740'
        notCompatibleWithConfigurationCache('Opt-in void driller client checks')
        doFirst {
            workingDir.mkdirs()
            def output = root.file("build/void-driller-qa/${qaLanguage}-scale${qaScale}")
            output.mkdirs()
            new File(workingDir, 'options.txt').setText("lang:${qaLanguage}\nguiScale:${qaScale}\npauseOnLostFocus:false\nsoundCategory_master:0.0\n", 'UTF-8')
            java.nio.file.Files.deleteIfExists(new File(output, 'result.txt').toPath())
            if (System.getProperty('os.name').startsWith('Windows')) {
                new ProcessBuilder('powershell.exe', '-NoProfile', '-NonInteractive', '-WindowStyle', 'Hidden',
                    '-ExecutionPolicy', 'Bypass', '-File', root.file('scripts/qa/HideFactoryClient.ps1').absolutePath,
                    '-Workspace', root.projectDir.absolutePath)
                    .redirectErrorStream(true)
                    .redirectOutput(new File(output, 'window-helper.log'))
                    .start()
            }
        }
        doLast {
            def result = root.file("build/void-driller-qa/${qaLanguage}-scale${qaScale}/result.txt")
            if (!result.exists() || !result.text.startsWith('PASS')) {
                throw new GradleException('Void driller QA failed; inspect result.txt and VOID_DRILLER_QA in the client log.')
            }
        }
    }
}
