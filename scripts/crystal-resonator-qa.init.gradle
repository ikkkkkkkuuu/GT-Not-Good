def qaHome = new File(gradle.startParameter.projectProperties.get('crystalResonatorQaRoot')
    ?: new File(gradle.startParameter.currentDir, 'build/crystal-resonator-isolated').path)

gradle.settingsEvaluated { settings ->
    settings.buildCache.local.directory = new File(qaHome, 'build-cache')
}

gradle.beforeProject { project ->
    if (project == project.rootProject) {
        project.layout.buildDirectory.set(new File(qaHome, 'build'))
    }
}

gradle.projectsEvaluated {
    def root = gradle.rootProject
    if (root.hasProperty('crystalResonatorSnapshot')) {
        root.sourceSets.main.java.setSrcDirs([new File(qaHome, 'snapshot/src/main/java')])
        // Use the already generated translations without rewriting another ongoing task's language output.
        root.tasks.named('preprocessLangInJavaFiles').configure { enabled = false }
    }
    def serverQA = root.hasProperty('crystalResonatorServerQA')
    def qaClass = serverQA ? 'EndCrystalResonatorServerChecks' : 'EndCrystalResonatorClientChecks'
    def output = root.layout.buildDirectory.dir(serverQA ? 'crystal-resonator-server-qa' : 'crystal-resonator-qa').get().asFile
    def testClasses = root.files(new File(output, 'test-classes')).builtBy(root.tasks.named('compileTestJava'))
    root.sourceSets.test.output.classesDirs.setFrom(testClasses)
    def qaRuntimeClasses = root.files(root.tasks.named('downgradeTestClasses').map { it.outputCollection })
    def efr = root.file('build/factory-qa-dependencies/etfuturum-2.6.59-GTNH-dev.jar')
    if (!efr.exists()) throw new GradleException('Prepare the existing factory QA Et Futurum runtime first')
    root.dependencies.add('runtimeOnlyNonPublishable', root.files(efr))
    root.tasks.named('compileTestJava').configure {
        destinationDirectory.set(new File(output, 'test-classes'))
        setSource(root.files("scripts/qa/${qaClass}.java"))
    }
    root.spotless {
        java {
            target 'src/main/java/com/xyp/gtnotgood/common/machines/basic/EndCrystalResonator.java',
                'src/main/java/com/xyp/gtnotgood/common/gui/BlockIcons.java',
                'src/main/java/com/xyp/gtnotgood/common/recipe/machine/EndCrystalResonatorRecipes.java',
                'src/main/java/com/xyp/gtnotgood/loader/EndCrystalResonatorLoader.java',
                'src/main/java/com/xyp/gtnotgood/loader/MachineLoader.java',
                'src/main/java/com/xyp/gtnotgood/loader/RecipeLoader.java',
                'src/main/java/com/xyp/gtnotgood/utils/enums/GTNGItemList.java',
                'src/main/java/com/xyp/gtnotgood/utils/enums/GTNGMachineID.java',
                'src/main/java/com/xyp/gtnotgood/utils/enums/ModsItemlist.java',
                'scripts/qa/EndCrystalResonatorClientChecks.java',
                'scripts/qa/EndCrystalResonatorServerChecks.java'
        }
    }
    root.tasks.named(serverQA ? 'runServer25' : 'runClient25').configure {
        dependsOn root.tasks.named('testClasses'), root.tasks.named('downgradeTestClasses')
        classpath -= root.sourceSets.test.output
        classpath += qaRuntimeClasses
        classpath += root.configurations.testRuntimeClasspath.filter { it.name.startsWith('jvmdowngrader-java-api-') }
        workingDir new File(output, 'run')
        systemProperty 'gtng.factory.qa', 'true'
        systemProperty 'gtng.crystalresonator.workspace', root.projectDir.absolutePath
        systemProperty 'gtng.crystalresonator.qa', 'true'
        systemProperty 'gtng.crystalresonator.serverQA', serverQA.toString()
        systemProperty 'gtng.crystalresonator.qa.output', output.absolutePath
        systemProperty 'sun.net.client.defaultConnectTimeout', '15000'
        systemProperty 'sun.net.client.defaultReadTimeout', '15000'
        if (serverQA) classpath = classpath.filter { !it.name.toLowerCase(Locale.ROOT).contains('angelica') }
        else args '--width', '1100', '--height', '800'
        notCompatibleWithConfigurationCache('Opt-in real End Crystal Resonator checks')
        doFirst {
            workingDir.mkdirs()
            java.nio.file.Files.deleteIfExists(new File(output, 'result.txt').toPath())
            if (serverQA) {
                new File(workingDir, 'eula.txt').setText('eula=true\n', 'UTF-8')
                new File(workingDir, 'server.properties').setText(
                    'server-ip=127.0.0.1\nserver-port=0\nlevel-type=FLAT\nonline-mode=false\n' +
                    'max-tick-time=-1\nview-distance=2\nenable-query=false\nenable-rcon=false\n', 'UTF-8')
                return
            }
            new File(workingDir, 'options.txt').setText(
                'lang:zh_CN\nguiScale:2\npauseOnLostFocus:false\nsoundCategory_master:0.0\nsoundCategory_music:0.0\n', 'UTF-8')
            def dreamConfig = new File(workingDir, 'config/DreamCoreMod.properties')
            dreamConfig.parentFile.mkdirs()
            def dreamProperties = new Properties()
            if (dreamConfig.exists()) dreamConfig.withInputStream { dreamProperties.load(it) }
            dreamProperties.setProperty('showConfirmExitWindow', 'false')
            dreamConfig.withOutputStream { dreamProperties.store(it, 'Isolated Crystal Resonator QA') }
            new File(workingDir, 'config/splash.properties').setText('enabled=false\n', 'UTF-8')
            if (System.getProperty('os.name').startsWith('Windows')) {
                new ProcessBuilder('powershell.exe', '-NoProfile', '-NonInteractive', '-WindowStyle', 'Hidden',
                    '-ExecutionPolicy', 'Bypass', '-File', root.file('scripts/qa/HideFactoryClient.ps1').absolutePath,
                    '-Workspace', root.projectDir.absolutePath)
                    .redirectErrorStream(true).redirectOutput(new File(output, 'window-helper.log')).start()
            }
        }
        doLast {
            def result = new File(output, 'result.txt')
            if (!result.exists() || result.text.trim() != 'PASS') {
                throw new GradleException('Crystal resonator QA failed; inspect CRYSTAL_RESONATOR_QA in the client log')
            }
        }
    }
}
