// Build an isolated manual-test runtime; leave Minecraft open for the player.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.named('compileTestJava').configure {
        setSource(root.fileTree('src/test/java/com/xyp/gtnotgood/common/packaged') { include '**/*.java' })
    }
    def mainSnapshot = root.layout.buildDirectory.dir('packaged-playground-runtime/main')
    def testSnapshot = root.layout.buildDirectory.dir('packaged-playground-runtime/test')
    def copyMain = root.tasks.register('snapshotPlaygroundMain', Sync) {
        dependsOn root.tasks.named('classes')
        from root.sourceSets.main.output
        into mainSnapshot
    }
    def copyTest = root.tasks.register('snapshotPlaygroundTest', Sync) {
        dependsOn root.tasks.named('testClasses')
        from root.sourceSets.test.output
        into testSnapshot
    }
    // Legacy packet discovery scans JAR entries only; a directory snapshot leaves its channels unregistered.
    def runtimeJar = root.tasks.register('jarPlaygroundRuntime', Jar) {
        dependsOn copyMain
        from mainSnapshot
        archiveFileName = 'packaged-playground-main.jar'
        destinationDirectory = root.layout.buildDirectory.dir('packaged-playground-runtime')
    }
    root.tasks.named('runClient').configure {
        dependsOn runtimeJar, copyTest
        classpath -= root.sourceSets.main.output
        classpath -= root.files(root.tasks.named('jar').flatMap { it.archiveFile })
        classpath += root.files(runtimeJar.flatMap { it.archiveFile }, testSnapshot)
        classpath += root.configurations.testRuntimeClasspath
        systemProperty 'gtng.packaged.playground', 'true'
        systemProperty 'gtng.packaged.playground.resume', root.findProperty('packagedPlaygroundResume') ?: ''
        systemProperty 'gtng.packaged.playground.ae', root.findProperty('packagedPlaygroundAE') ?: 'false'
        systemProperty 'gtng.packaged.playground.repair', root.findProperty('packagedPlaygroundRepair') ?: 'false'
        systemProperty 'gtng.packaged.playground.inspect', root.findProperty('packagedPlaygroundInspect') ?: 'false'
        systemProperty 'gtng.packaged.connector.qa', root.findProperty('packagedConnectorQA') ?: 'false'
        args '--width', '1100', '--height', '740'
    }
}
