// Run with: gradlew.bat -I docs/testing/mechanical-user-client.gradle runClient
gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.named('runClient').configure {
        dependsOn root.tasks.named('testClasses')
        workingDir root.file('run/mechanical-user-check')
        doFirst { workingDir.mkdirs() }
        classpath += root.sourceSets.test.output
        systemProperty 'mechanicaluser.qa', 'true'
        args '--width', '1100', '--height', '740'
    }
}
