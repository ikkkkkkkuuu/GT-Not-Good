name: Bug 报告 / Bug Report
description: 报告崩溃、功能异常、模组冲突或其他问题 / Report crashes, feature issues, mod conflicts, or other problems.
title: "[Bug] "
labels:
  - "bug"
assignees: ikkkkkkuuu

body:
  - type: input
    id: pack_version
    attributes:
      label: GTNH 版本 / GTNH Version
      description: |
        你正在使用的 GTNH 版本。
        What version of GTNH are you using?

        如果使用的是较旧版本，请先尝试更新到最新版本。
        If you are using an old version, please try updating to the latest version first.
      placeholder: "例如：2.7.4 / Example: 2.7.4"
    validations:
      required: true

  - type: input
    id: mod_version
    attributes:
      label: GT-Not-Good 版本 / GT-Not-Good Version
      description: |
        请填写实际版本号或 jar 文件名，不要填写“最新版”。
        Please provide the actual version number or jar filename, not "latest".

        如果不是最新版本，请先尝试更新。
        If you are not using the latest version, please try updating first.
      placeholder: "例如：1.0.0 / Example: 1.0.0"
    validations:
      required: true

  - type: textarea
    id: whatistheissue
    attributes:
      label: 问题描述 / Describe the Issue
      description: |
        请详细描述问题、复现步骤、实际结果以及预期结果。
        Please describe the issue, reproduction steps, actual result, and expected result.

      placeholder: |
        复现步骤 / Steps to reproduce:
        1. 放置 XXX 机器 / Place XXX machine
        2. 输入 XXX / Insert XXX
        3. 点击 XXX / Click XXX

        实际结果 / Actual result:
        XXX

        预期结果 / Expected result:
        XXX
    validations:
      required: true

  - type: textarea
    id: conflict
    attributes:
      label: 可能冲突的模组 / Conflicting Mods
      description: |
        如果你认为这是模组冲突，请列出可能导致问题的模组及版本。
        If you think this is a mod conflict, list the mods that may be causing the issue and their versions.
      placeholder: |
        例如 / Example:

        Mod A 1.2.3
        Mod B 4.5.6

        问题仅在安装 Mod A 后出现。
        The issue only occurs when Mod A is installed.
    validations:
      required: false

  - type: dropdown
    id: java
    attributes:
      label: Java 版本 / Java Version
      description: |
        你正在使用哪个 Java 版本？
        Which Java version are you using?

        如果使用的是较新的 Java 版本，请确保已经更新到该大版本的最新小版本。
        If you are using a newer Java version, make sure it is updated to the latest minor release.
      options:
        - Java 8
        - Java 17
        - Java 21
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 游戏环境 / Game Environment
      description: |
        请提供与你的问题相关的运行环境信息。
        Please provide relevant information about your game environment.
      placeholder: |
        操作系统 / Operating System:
        Windows 11

        启动器 / Launcher:
        Prism Launcher / MultiMC / HMCL / Other

        游戏模式 / Game Mode:
        单机 / Singleplayer
        服务端 / Multiplayer Server

        服务端类型 / Server Type:
        本地服务端 / Local Server
        Dedicated Server
        Other

        其他信息 / Other information:
    validations:
      required: false

  - type: textarea
    id: report
    attributes:
      label: 崩溃报告 / 日志 / Crash Report / Log
      description: |
        如果发生崩溃，请提供完整的 Crash Report。
        If the game crashes, please provide the complete Crash Report.

        如果没有生成 Crash Report，请提供相关日志，例如：
        If no Crash Report was generated, please provide the relevant log, for example:

        logs/fml-client-latest.log
        logs/fml-server-latest.log

        你可以直接将文件拖入此文本框。
        You can drag and drop the file directly into this textbox.
      placeholder: |
        请将日志粘贴到这里，
        或直接拖入日志文件。

        Paste the log here,
        or drag and drop the log file here.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 视频 / Screenshots / Video
      description: |
        如果问题可以通过截图或视频说明，请上传相关内容。
        If screenshots or videos can help explain the issue, please upload them here.
      placeholder: |
        将截图或视频直接拖到这里。
        Drag and drop screenshots or videos here.
    validations:
      required: false

  - type: checkboxes
    id: final
    attributes:
      label: 最终检查 / Final Checklist
      description: |
        提交 Issue 前，请确认以下内容。
        Please confirm the following before submitting the issue.
      options:
        - label: "我已经搜索过 Issue，没有找到相同或类似的问题。 / I have searched the issue tracker and could not find a similar issue."
          required: true

        - label: "我已经确认自己使用的是最新版本，或者确认问题在最新版本中仍然存在。 / I have confirmed that I am using the latest version, or that the issue still exists in the latest version."
          required: true

        - label: "我已经提供了能够帮助开发者复现问题的必要信息。 / I have provided enough information to help developers reproduce the issue."
          required: true

        - label: "我已经阅读并同意遵守项目的 Issue 提交规范。 / I have read and agree to follow the project's issue submission guidelines."
          required: true
